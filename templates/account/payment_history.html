
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/admin/admin__base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/admin/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/account/header_account.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/account/sidebar_account.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/account/account_base.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>

    <title>Lịch sử giao dịch</title>

    <style>
        .dt-header,
        .dt-info {
            font-size: 1.6rem;
        }
    </style>

    <script>
        /* ============================
           1. Toggle form thêm
        ============================= */
        function addPropertyForm() {
            const form = document.getElementById("addPropertyForm");
            const table = document.getElementById("table-container");

            form.style.display = form.style.display === "block" ? "none" : "block";
            table.style.display = table.style.display === "none" ? "block" : "none";
        }

        /* ============================
           2. Toggle form sửa
        ============================= */
        function editPropertyForm() {
            const form = document.getElementById("editPropertyForm");
            const table = document.getElementById("table-container");

            form.style.display = form.style.display === "block" ? "none" : "block";
            table.style.display = table.style.display === "none" ? "block" : "none";
        }

        /* ============================
           3. Menu admin
        ============================= */
        document.addEventListener('DOMContentLoaded', function () {
            const navUser = document.querySelector('.nav__admin');
            const dropdownMenu = document.querySelector('.nav__form-admin');

            navUser.addEventListener('click', function (event) {
                event.stopPropagation();
                dropdownMenu.style.display =
                    dropdownMenu.style.display === 'block' ? 'none' : 'block';
            });

            document.addEventListener('click', function (event) {
                if (!navUser.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    dropdownMenu.style.display = 'none';
                }
            });
        });
    </script>

</head>

<body>
<div class="admin">
    {% include 'account/header_account.html' %}

    <div class="container">
    {% include 'account/sidebar_account.html' %}


        <!-- Table Section -->
        <div id="table-container">
            <h3>Lịch sử giao dịch</h3>
            <div class="property_management">

                <table id="propertyTable">
                    <thead>
                    <tr>
                        <th>Gói thanh toán</th>
                        <th>số tiền</th>
                        <th>Phuơng thức</th>
                        <th>Trạng thái</th>
                        <th>Ngày thanh toán</th>
                    </tr>
                    </thead>

                    <tbody>
                    {%for t in transactions %}
                        <tr>
                            <td>{{t.package}}</td>
                            <td>{{t.amount}}</td>
                            <td>{{t.payment_method}}</td>
                            <td>{{t.status}}</td>
                            <td>{{t.created_at}}</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>

            </div>
        </div>

        <!-- Form thêm -->




    </div>
</div>

<script>
    $(document).ready(function () {
        let table = $('#propertyTable').DataTable();


    });
</script>

</body>
</html>

</body>
</html>
