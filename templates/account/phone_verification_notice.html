<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác thực số điện thoại</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f0ff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .notice-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s;
        }

        .notice-container:hover {
            transform: translateY(-5px);
        }

        .notice-container h2 {
            font-size: 2rem;
            color: #ff5e57;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notice-container h2::before {
            content: "⚠";
            margin-right: 10px;
            font-size: 2.2rem;
        }

        .notice-container p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .notice-container a.btn {
            display: inline-block;
            padding: 12px 30px;
            background: #007bff;
            color: #fff;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
            transition: all 0.3s;
        }

        .notice-container a.btn:hover {
            background: #0056b3;
            box-shadow: 0 8px 20px rgba(0,86,179,0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .notice-container {
                padding: 30px 20px;
            }

            .notice-container h2 {
                font-size: 1.7rem;
            }

            .notice-container p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="notice-container">
        <h2>Thông báo</h2>
        <p>{{ message }}</p>
        <a href="{{ url_for('user.account') }}" class="btn">Xác thực ngay</a>
    </div>
</body>
</html>
