<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #e6f7ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-container {
            background: #fff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: transform 0.3s;
        }

        .success-container:hover {
            transform: translateY(-5px);
        }

        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2rem;
            color: #28a745;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 30px;
        }

        .success-container a.btn {
            display: inline-block;
            padding: 12px 30px;
            background: #007bff;
            color: #fff;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
            transition: all 0.3s;
        }

        .success-container a.btn:hover {
            background: #0056b3;
            box-shadow: 0 8px 20px rgba(0,86,179,0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 500px){
            .success-container {
                padding: 30px 20px;
            }
            h2 { font-size: 1.7rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h2>Thanh toán thành công!</h2>
        <p>Bạn đã mua gói: <strong>{{ package_name }}</strong><br>
           Số tiền: <strong>{{ "{:,.0f}".format(amount) }} VNĐ</strong>
        </p>
        <a href="{{ url_for('user.add_property') }}" class="btn">Tiếp tục đăng tin</a>
    </div>
</body>
</html>
