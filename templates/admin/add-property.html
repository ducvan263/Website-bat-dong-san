<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm bất động sản</title>

    <link rel="stylesheet" href="{{ url_for('static',filename='css/admin/admin__base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/admin/base.css') }}">

    <style>
        body{font-family:Arial,sans-serif;background:#f5f5f5}
        .content--add-property{width:900px;margin:30px auto;background:#fff;padding:25px;border-radius:8px}
        h1{font-size:2rem}
        h2{margin-top:30px;border-bottom:2px solid #eee;padding-bottom:5px;font-size:1.8rem}
        .form-group{margin-bottom:15px}
        label{font-size:1.6rem;font-weight:bold;margin-bottom:6px;display:block}
        input,select,textarea{width:100%;padding:8px}
        textarea{min-height:100px}
        .row{display:flex;gap:15px}
        .row .form-group{flex:1}
        button{background:#007bff;color:#fff;padding:10px 18px;border:none;border-radius:4px;cursor:pointer}
        button:hover{background:#0056b3}
        .ai-box{background:#f1f7ff;padding:15px;border-radius:6px}
    </style>
</head>

<body>
<div class="admin">
    {% include 'admin/header.html' %}
    <div class="container">
        {% include 'admin/sidebar.html' %}

        <div class="content--add-property">

            <h1>Thêm bất động sản</h1>

            <form method="POST" action="/admin/properties/create" enctype="multipart/form-data">

                <!-- hidden for AI -->
                <input type="hidden" name="city" id="city">

                <!-- ================= BASIC ================= -->
                <h2>Thông tin cơ bản</h2>

                <div class="form-group">
                    <label>Tiêu đề *</label>
                    <input type="text" name="title" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Giá niêm yết (VNĐ)</label>
                        <input type="number" name="price">
                    </div>

                    <div class="form-group">
                        <label>Loại hình nhà ở</label>
                        <select name="Loại hình nhà ở" id="house_type">
<!--                            {% for t in property_types %}-->
<!--                            <option value="{{ t.name }}">{{ t.name }}</option>-->
<!--                            {% endfor %}-->

                                <option value="Nhà mặt phố">Nhà mặt phố</option>
                                <option value="Nhà ngõ,hẻm">Nhà ngõ,hẻm</option>
                        </select>
                    </div>
                </div>

                <!-- ================= LOCATION ================= -->
                <h2>Vị trí</h2>
                <div class="row">
                    <div class="form-group">
                        <label>Tỉnh / Thành phố</label>
                        <select id="province">
                            <option value="">-- Chọn tỉnh --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quận / Huyện</label>
                        <select id="district">
                            <option value="">-- Chọn quận --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Phường / Xã</label>
                        <select id="ward">
                            <option value="">-- Chọn phường --</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                        <label>Giấy tờ pháp lý</label>
                        <select name="Giấy tờ pháp lý">
                            <option value="Sổ đỏ/ Sổ hồng">Sổ đỏ / Sổ hồng</option>
                            <option value="Giấy tay">Giấy tay</option>
                            <option value="Đang chờ sổ">Đang chờ sổ</option>
                        </select>
                    </div>
                                <!-- ================= FEATURES ================= -->
                    <h2>Thuộc tính</h2>
                    <div class="row">
                        <div class="form-group">
                            <label>Diện tích (m²)</label>
                            <input type="number" name="Diện tích" id="area">
                        </div>

                        <div class="form-group">
                            <label>Số phòng ngủ</label>
                            <input type="number" name="Số phòng ngủ" id="bedrooms">
                        </div>

                        <div class="form-group">
                            <label>Số tầng</label>
                            <input type="number" name="Số tầng" id="floors">
                        </div>
                    </div>

                    <!-- HCM only -->
                    <div class="row" id="hcm-fields">
                        <div class="form-group">
                            <label>Chiều ngang (m)</label>
                            <input type="number" name="Chiều ngang" id="width">
                        </div>

                        <div class="form-group">
                            <label>Chiều dài (m)</label>
                            <input type="number" name="Chiều dài" id="length">
                        </div>
                    </div>

                <!-- ================= AI ================= -->
                <h2>🤖 Giá AI gợi ý (Chỉ áp dụng cho Hà Nội Hoặc Thành Phố Hồ Chí Minh)</h2>
                <div class="ai-box">
                    <div class="row">
                        <div class="form-group">
                            <label>Giá AI (VNĐ/m²)</label>
                            <input style="outline:none; cursor : default;" id="ai_price_m2" readonly>
                        </div>
                        <div class="form-group">
                            <label>Tổng giá AI (VNĐ)</label>
                            <input style="outline:none; cursor : default;" id="ai_total_price" readonly>
                        </div>
                    </div>
                    <button type="button" onclick="predictPrice()">Dự đoán giá</button>
                </div>

                <!-- ================= IMAGE ================= -->
                <h2>Hình ảnh</h2>
                <input type="file" name="thumbnail">
                <input type="file" name="images[]" multiple>

                <br><br>
                <button type="submit">Đăng bất động sản</button>
            </form>

        </div>
    </div>
</div>

<script>
const API = 'https://provinces.open-api.vn/api/v1';

const province = document.getElementById('province');
const district = document.getElementById('district');
const ward = document.getElementById('ward');
const city = document.getElementById('city');

// ================= LOAD PROVINCES =================
fetch(`${API}/p/`)
    .then(res => res.json())
    .then(data => {
        data.forEach(p => {
            province.innerHTML += `<option value="${p.code}">${p.name}</option>`;
        });
    });

// ================= PROVINCE CHANGE =================
province.addEventListener('change', async () => {
    district.innerHTML = '<option value="">-- Chọn quận --</option>';
    ward.innerHTML = '<option value="">-- Chọn phường --</option>';
    detectCity();

    if (!province.value) return;

    const res = await fetch(`${API}/p/${province.value}?depth=2`);
    const data = await res.json();

    if (!data.districts) return;

    data.districts.forEach(d => {
        district.innerHTML += `<option value="${d.code}">${d.name}</option>`;
    });
});

// ================= DISTRICT CHANGE =================
district.addEventListener('change', async () => {
    ward.innerHTML = '<option value="">-- Chọn phường --</option>';

    if (!district.value) return;

    const res = await fetch(`${API}/d/${district.value}?depth=2`);
    const data = await res.json();

    if (!data.wards) return;

    data.wards.forEach(w => {
        ward.innerHTML += `<option value="${w.name}">${w.name}</option>`;
    });
});

// ================= DETECT CITY =================
function detectCity() {
    const text = province.options[province.selectedIndex]?.text || '';

}


</script>

<script>
function predictPrice() {
    const provinceSelect = document.getElementById("province");
    const districtSelect = document.getElementById("district");
    const wardSelect = document.getElementById("ward");

    const provinceName =
        provinceSelect.options[provinceSelect.selectedIndex]?.text || "";

    const districtName =
        districtSelect.options[districtSelect.selectedIndex]?.text || "";

    const wardName =
        wardSelect.options[wardSelect.selectedIndex]?.text || null;

    const data = {
        "Tỉnh/Thành phố": provinceName,
        "Quận": districtName,
        "Phường": wardName,

        "Loại hình nhà ở": document.getElementById("house_type").value,
        "Giấy tờ pháp lý": document.querySelector('[name="Giấy tờ pháp lý"]').value,

        "Số tầng": Number(document.getElementById("floors").value || 0),
        "Số phòng ngủ": Number(document.getElementById("bedrooms").value || 0),
        "Diện tích": Number(document.getElementById("area").value || 0)
    };

    // TP.HCM có chiều ngang/dài
    if (provinceName.includes("Hồ Chí Minh")) {
        data["Chiều ngang"] = Number(document.getElementById("width").value || 0);
        data["Chiều dài"]  = Number(document.getElementById("length").value || 0);
    }

    console.log("📦 Data gửi AI:", data);

    fetch("/api/predict-price", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        document.getElementById("ai_price_m2").value =
            result.price_m2?.toLocaleString("vi-VN");

        document.getElementById("ai_total_price").value =
            result.total_price?.toLocaleString("vi-VN");
    })
    .catch(err => {
        console.error("❌ Lỗi AI:", err);
        alert("Không thể dự đoán giá AI");
    });
}
</script>


</body>
</html>
